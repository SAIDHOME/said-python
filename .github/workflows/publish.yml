name: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    strategy:
      matrix:
        include:
          - package: asksaid
            environment: pypi
          - package: said-core
            environment: pypi-said-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build ${{ matrix.package }} --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
