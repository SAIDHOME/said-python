[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asksaid"
version = "0.0.1"
description = "Python SDK for .said, the memory file any AI can use. Name reserved; the first release is coming."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "SAIDHOME" }]

[project.urls]
Homepage = "https://asksaid.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/asksaid"]
